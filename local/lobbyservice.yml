# Override file: sends /api/lobbyservice/* to LobbyService running on your own machine
# (started from its own repo with docker compose, on port 5004). Use it together
# with docker-compose.yml, see the top of that file.
services:
  edge:
    environment:
      # Your machine instead of the cluster.
      ReverseProxy__Clusters__lobbyservice__Destinations__d1__Address: http://host.docker.internal:5004/
      # Remove the service name, like the real edge does: /api/lobbyservice/x -> /api/x.
      ReverseProxy__Routes__lobbyservice__Transforms__0__PathPattern: "/api/{**rest}"
