# Override file: sends /api/musicservice/* to MusicService running on your own machine
# (started from its own repo with docker compose, on port 5002). Use it together
# with docker-compose.yml, see the top of that file.
services:
  edge:
    environment:
      # Your machine instead of the cluster.
      ReverseProxy__Clusters__musicservice__Destinations__d1__Address: http://host.docker.internal:5002/
      # Remove the service name, like the real edge does: /api/musicservice/x -> /api/x.
      ReverseProxy__Routes__musicservice__Transforms__0__PathPattern: "/api/{**rest}"
